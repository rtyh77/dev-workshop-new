<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1117">
<title>الاستوديو التلقائي - Dev Workshop</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--accent:#58a6ff;--text:#c9d1d9;--muted:#8b949e;--border:#30363d;--green:#238636}
*{box-sizing:border-box}
body{font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:16px;line-height:1.7}
.wrap{max-width:900px;margin:auto;display:grid;gap:18px}
header{text-align:center;padding:16px 0;border-bottom:1px solid var(--border)}
h1{color:var(--accent);margin:0;font-size:clamp(1.4rem,5vw,2rem)}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:clamp(16px,4vw,22px)}
label{display:block;margin:12px 0 5px;font-weight:600}
input,select{display:block;width:100%;padding:12px;margin:7px 0;background:#0d1117;border:1px solid var(--border);color:#fff;border-radius:8px;font:inherit}
button,.btn{display:block;width:100%;background:var(--green);color:#fff;border:0;padding:12px 18px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;margin-top:12px}
button:disabled{opacity:.6;cursor:wait}
.btn.alt{background:#30363d}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;gap:8px;align-items:center;font-weight:400}
.chk input{width:auto;margin:0}
.status{padding:10px;border-radius:8px;margin-top:12px;background:#0d1117;border:1px solid var(--border);white-space:pre-wrap;overflow-wrap:anywhere}
.status.error{color:#ff7b72;border-color:#6e3030}
.status.ok{color:#7ee787}
.out video{display:block;width:100%;margin:12px auto;border-radius:10px;background:#000}
.note{color:var(--muted);font-size:.86rem}
@media(max-width:560px){body{padding:12px}.row{grid-template-columns:1fr}}
</style>
<script>
/* شريط أخطاء: يحتفظ بكل الرسائل ليسهل التشخيص */
(function(){
  function show(m){
    var b=document.getElementById("errBar");
    if(!b){b=document.createElement("div");b.id="errBar";
      b.style.cssText="position:fixed;bottom:0;left:0;right:0;background:#6e3030;color:#fff;padding:8px 12px;font-size:.8rem;z-index:99;direction:ltr;white-space:pre-wrap;max-height:30vh;overflow:auto";
      (document.body||document.documentElement).appendChild(b);}
    b.textContent=(b.textContent?b.textContent+"\n":"")+"⚠ "+m;
  }
  window.addEventListener("error",function(e){show((e.message||"error")+(e.lineno?" (line "+e.lineno+")":""));});
  window.addEventListener("unhandledrejection",function(e){var r=e.reason;show("promise: "+((r&&r.message)||r));});
})();
</script>
</head>
<body>
<div class="wrap">
<header>
  <h1>🚀 الاستوديو التلقائي</h1>
  <p class="note">موضوع واحد ← مشاهد ← صور ← عمق ثلاثي ← صوت وترجمة، كله مجاني داخل متصفحك</p>
</header>

<section class="card">
  <label for="topic">موضوع الفيديو</label>
  <input id="topic" type="text" placeholder="مثال: رحلة طفل في غابة سحرية وقت الفجر">

  <div class="row">
    <div>
      <label for="count">عدد المشاهد</label>
      <select id="count"><option>4</option><option selected>6</option><option>8</option><option>10</option></select>
    </div>
    <div>
      <label for="sec">أقل مدة للمشهد</label>
      <select id="sec"><option>4</option><option selected>5</option><option>7</option></select>
    </div>
  </div>

  <label for="ratio">اتجاه الفيديو</label>
  <select id="ratio">
    <option value="9:16">عمودي 9:16 — TikTok / Shorts</option>
    <option value="16:9">أفقي 16:9 — YouTube</option>
    <option value="1:1">مربع 1:1</option>
  </select>

  <label class="chk"><input id="voice" type="checkbox" checked> تعليق صوتي (مجاني، قد لا يتوفر دائمًا)</label>
  <label class="chk"><input id="cap" type="checkbox" checked> ترجمة على الفيديو</label>
  <label class="chk"><input id="depth" type="checkbox" checked> حركة العمق ثلاثية الأبعاد (تحميل نموذج أول مرة)</label>

  <button id="go" type="button">🚀 أنشئ الفيديو كاملًا</button>
  <div id="status" class="status" aria-live="polite">اكتب الموضوع واضغط الزر. أبقِ الصفحة مفتوحة أثناء التركيب.</div>
  <div class="out" id="out"></div>
  <a class="btn alt" href="index.html">⬅ العودة إلى ورشة المطور</a>
</section>
</div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const VDIM = { "9:16": [540, 960], "16:9": [960, 540], "1:1": [720, 720] };
const PDIM = { "9:16": [720, 1280], "16:9": [1280, 720], "1:1": [1024, 1024] };

function setStatus(msg, type = "") { const e = $("status"); e.textContent = msg; e.className = "status" + (type ? " " + type : ""); }
function errMsg(e) { return e?.message || (typeof e === "string" ? e : "خطأ غير معروف."); }

function loadImg(src) {
  return new Promise((res, rej) => {
    const i = new Image(); i.crossOrigin = "anonymous";
    i.onload = () => res(i); i.onerror = () => rej(new Error("تعذّر تحميل صورة من المحرك المجاني."));
    i.src = src;
  });
}
async function freeImage(prompt, ratio) {
  const [w, h] = PDIM[ratio]; let last;
  for (let k = 0; k < 2; k++) {
    const url = "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt) +
      `?width=${w}&height=${h}&seed=${Math.floor(Math.random() * 1e9)}&nologo=true`;
    try { return await loadImg(url); } catch (e) { last = e; }
  }
  throw last;
}
async function freeText(prompt) {
  const r = await fetch("https://text.pollinations.ai/openai", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model: "openai", messages: [{ role: "user", content: prompt }] })
  });
  if (!r.ok) throw new Error("المحرك النصي المجاني غير متاح الآن (" + r.status + ").");
  const t = (await r.json())?.choices?.[0]?.message?.content;
  if (!t) throw new Error("رد فارغ من المحرك النصي.");
  return t;
}
async function fetchVoice(ac, text) {
  const r = await fetch("https://text.pollinations.ai/" + encodeURIComponent(text) + "?model=openai-audio&voice=nova");
  if (!r.ok) throw new Error("voice");
  return ac.decodeAudioData(await r.arrayBuffer());
}

let depthPipe = null;
async function getDepth() {
  if (!depthPipe) {
    const { pipeline, env } = await import("https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2");
    env.allowLocalModels = false;
    depthPipe = await pipeline("depth-estimation", "Xenova/depth-anything-small-hf");
  }
  return depthPipe;
}

function wrapText(ctx, text, maxW) {
  const words = text.split(/\s+/), lines = []; let cur = "";
  for (const w of words) {
    const t = cur ? cur + " " + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines.slice(0, 3);
}

function makeGL(W, H) {
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const gl = c.getContext("webgl", { preserveDrawingBuffer: true, alpha: false });
  if (!gl) throw new Error("متصفحك لا يدعم WebGL.");
  const sh = (t, src) => { const o = gl.createShader(t); gl.shaderSource(o, src); gl.compileShader(o); return o; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, "attribute vec2 p;varying vec2 uv;void main(){uv=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}"));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, "precision mediump float;varying vec2 uv;uniform sampler2D im,dp;uniform vec2 off;uniform float zm,al;void main(){vec2 c=(uv-.5)/zm+.5;float d=texture2D(dp,c).r;gl_FragColor=vec4(texture2D(im,clamp(c+off*(d-.5),0.,1.)).rgb,al);}"));
  gl.linkProgram(pr); gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, "p");
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.uniform1i(gl.getUniformLocation(pr, "im"), 0); gl.uniform1i(gl.getUniformLocation(pr, "dp"), 1);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  const U = n => gl.getUniformLocation(pr, n);
  const tex = unit => {
    const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
    [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE));
    [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.LINEAR));
    return t;
  };
  return {
    canvas: c,
    upload(sc) {
      sc.ti = tex(0); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, sc.img);
      sc.td = tex(1); gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, sc.dw || 1, sc.dh || 1, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, sc.dArr || new Uint8Array([128]));
    },
    clear() { gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); },
    draw(sc, t, al, i) {
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sc.ti);
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, sc.td);
      const d = i % 2 ? -1 : 1;
      gl.uniform2f(U("off"), d * (t - 0.5) * 0.07, (0.5 - t) * 0.02);
      gl.uniform1f(U("zm"), 1.06 + 0.08 * (i % 2 ? 1 - t : t));
      gl.uniform1f(U("al"), al);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
  };
}

$("go").addEventListener("click", async () => {
  const topic = $("topic").value.trim();
  if (!topic) { setStatus("اكتب موضوع الفيديو أولاً.", "error"); return; }
  if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) {
    setStatus("متصفحك لا يدعم تسجيل الفيديو. جرّب Chrome حديثًا.", "error"); return;
  }
  const btn = $("go"), out = $("out");
  const n = Number($("count").value), base = Number($("sec").value), ratio = $("ratio").value;
  const [W, H] = VDIM[ratio];
  const useVoice = $("voice").checked, showCap = $("cap").checked, useDepth = $("depth").checked;
  const notes = [];
  btn.disabled = true; btn.textContent = "جارٍ العمل…"; out.replaceChildren();

  try {
    setStatus("✍️ جارٍ كتابة السيناريو…");
    const raw = await freeText(
      `اكتب سيناريو فيديو قصير عن: ${topic}\nأخرج مصفوفة JSON فقط من ${n} عناصر، بلا أي نص آخر وبلا Markdown.\n` +
      `كل عنصر: {"narration":"جملة تعليق عربية قصيرة لا تتجاوز 18 كلمة","image":"English detailed visual prompt for this scene, cinematic, no text in image"}`);
    const m = raw.match(/\[[\s\S]*\]/);
    if (!m) throw new Error("تعذّر فهم رد الكاتب. أعد المحاولة.");
    const plan = JSON.parse(m[0]).filter(x => x && x.image).slice(0, n);
    if (!plan.length) throw new Error("لم يُنتج الكاتب مشاهد صالحة. أعد المحاولة.");

    const ac = new (window.AudioContext || window.webkitAudioContext)();
    await ac.resume();
    const dest = ac.createMediaStreamDestination();
    const g = makeGL(W, H);

    let dp = null;
    if (useDepth) {
      try { setStatus("🧠 تحميل نموذج العمق (أول مرة فقط)…"); dp = await getDepth(); }
      catch (e) { notes.push("تعذّر نموذج العمق، استُخدمت حركة تقريب عادية."); }
    }

    const scenes = [];
    for (let i = 0; i < plan.length; i++) {
      const p = plan[i];
      setStatus(`🎨 المشهد ${i + 1} من ${plan.length}: الصورة والعمق والصوت…`);
      const img = await freeImage(p.image + ", cinematic lighting, highly detailed", ratio);
      const sc = { img, caption: p.narration || "", dur: base, buf: null };
      if (dp) {
        try {
          const c = document.createElement("canvas"), k = 512 / Math.max(img.width, img.height);
          c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          const d = (await dp(c.toDataURL("image/jpeg", 0.85))).depth;
          const ch = d.channels || 1, arr = new Uint8Array(d.width * d.height);
          for (let j = 0; j < arr.length; j++) arr[j] = d.data[j * ch];
          sc.dArr = arr; sc.dw = d.width; sc.dh = d.height;
        } catch (e) { if (!notes.some(x => x.includes("العمق"))) notes.push("تعذّر العمق لبعض المشاهد."); }
      }
      if (useVoice && sc.caption) {
        try { sc.buf = await fetchVoice(ac, sc.caption); sc.dur = Math.max(base, sc.buf.duration + 0.5); }
        catch (e) { if (!notes.some(x => x.includes("صوت"))) notes.push("تعذّر التعليق الصوتي المجاني، صُنع الفيديو بدون صوت."); }
      }
      g.upload(sc); scenes.push(sc);
    }

    let acc = 0; scenes.forEach(sc => { sc.start = acc; acc += sc.dur; });
    const total = acc, F = 0.6;
    const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    const ctx = cv.getContext("2d");
    const stream = cv.captureStream(30);
    if (scenes.some(s => s.buf)) dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
    const mime = ["video/mp4", "video/webm;codecs=vp9,opus", "video/webm"].find(x => MediaRecorder.isTypeSupported(x)) || "";
    const rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 5e6 } : { videoBitsPerSecond: 5e6 });
    const chunks = [];
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    const done = new Promise(r => { rec.onstop = r; });
    rec.start(250);
    const t0 = performance.now(); let played = -1;

    await new Promise(resolve => {
      const frame = now => {
        const T = Math.min((now - t0) / 1000, total);
        let i = scenes.length - 1; while (i > 0 && scenes[i].start > T) i--;
        const sc = scenes[i], local = T - sc.start, t = Math.min(local / sc.dur, 1);
        if (i !== played) { played = i; if (sc.buf) { const s = ac.createBufferSource(); s.buffer = sc.buf; s.connect(dest); s.start(); } }
        g.clear();
        if (i > 0 && local < F) { g.draw(scenes[i - 1], 1, 1, i - 1); g.draw(sc, t, local / F, i); } else g.draw(sc, t, 1, i);
        ctx.drawImage(g.canvas, 0, 0);
        if (showCap && sc.caption) {
          const fs = Math.round(W * 0.05);
          ctx.font = `700 ${fs}px system-ui, Tahoma, sans-serif`; ctx.direction = "rtl"; ctx.textAlign = "center";
          const lines = wrapText(ctx, sc.caption, W * 0.86), lh = fs * 1.4, y0 = H - H * 0.08 - lines.length * lh;
          ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(W * 0.04, y0 - lh * 0.2, W * 0.92, lines.length * lh + lh * 0.3);
          ctx.fillStyle = "#fff"; lines.forEach((l, k) => ctx.fillText(l, W / 2, y0 + (k + 0.8) * lh));
        }
        setStatus(`🎬 جارٍ التركيب… ${Math.round(T / total * 100)}%\nلا تغلق الصفحة أو تغيّر التبويب.`);
        if (T < total) requestAnimationFrame(frame); else resolve();
      };
      requestAnimationFrame(frame);
    });

    rec.stop(); await done; ac.close();
    const blob = new Blob(chunks, { type: (mime || "video/webm").split(";")[0] });
    const url = URL.createObjectURL(blob);
    const v = document.createElement("video"); v.src = url; v.controls = true; v.playsInline = true; out.appendChild(v);
    const a = document.createElement("a"); a.className = "btn"; a.href = url;
    a.download = "dev-workshop-studio." + (blob.type.includes("mp4") ? "mp4" : "webm");
    a.textContent = "⬇️ تنزيل الفيديو"; out.appendChild(a);
    setStatus(`✅ تم إنشاء فيديو مدته ${Math.round(total)} ثانية من ${scenes.length} مشاهد.` + (notes.length ? "\nملاحظات: " + notes.join(" ") : ""), "ok");
  } catch (error) {
    setStatus("❌ تعذّر إنشاء الفيديو: " + errMsg(error) + "\nأعد المحاولة أو قلّل عدد المشاهد.", "error");
  } finally {
    btn.disabled = false; btn.textContent = "🚀 أنشئ الفيديو كاملًا";
  }
});
})();
</script>
</body>
</html>
