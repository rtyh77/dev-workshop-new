<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1117">
<title>ورشة المطور - Dev Workshop Studio</title>

<style>
:root{
  --bg:#0d1117;--card:#161b22;--accent:#58a6ff;
  --text:#c9d1d9;--muted:#8b949e;--border:#30363d;
  --green:#238636;--red:#f85149;
}
*{box-sizing:border-box}
body{
  font-family:system-ui,"Segoe UI",Tahoma,sans-serif;
  background:var(--bg);color:var(--text);
  margin:0;padding:16px;line-height:1.7
}
header{
  text-align:center;padding:24px 0;
  border-bottom:1px solid var(--border);
  margin:0 auto 24px;max-width:900px
}
header h1{
  color:var(--accent);margin:0;
  font-size:clamp(1.6rem,5vw,2.2rem)
}
header p,.muted,.note{color:var(--muted)}
.container{max-width:900px;margin:auto;display:grid;gap:18px}
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:clamp(16px,4vw,22px);
  box-shadow:0 4px 12px #0003
}
h2{color:var(--accent);font-size:1.35rem;margin:0 0 10px}
label{display:block;margin:12px 0 5px;font-weight:600}
input,textarea,select{
  display:block;width:100%;padding:12px;margin:7px 0;
  background:#0d1117;border:1px solid var(--border);
  color:#fff;border-radius:8px;font:inherit;min-width:0
}
