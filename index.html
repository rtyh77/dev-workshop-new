<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1117">
  <title>ورشة المطور - Dev Workshop Studio</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --accent: #58a6ff;
      --text: #c9d1d9;
      --muted: #8b949e;
      --border: #30363d;
      --green: #238636;
      --shadow: rgba(0,0,0,.3);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px;
      background: var(--bg); color: var(--text);
      font-family: system-ui, "Segoe UI", Tahoma, sans-serif;
      line-height: 1.7;
    }
    header {
      max-width: 900px; margin: 0 auto 24px; padding: 24px 0;
      text-align: center; border-bottom: 1px solid var(--border);
    }
    header h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2.2rem); color: var(--accent); }
    header p { margin: 10px 0 0; color: var(--muted); }
    .container { max-width: 900px; margin: auto; display: grid; gap: 18px; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: clamp(16px, 4vw, 22px);
      box-shadow: 0 4px 12px var(--shadow);
    }
    h2 { margin: 0 0 10px; color: var(--accent); font-size: 1.35rem; }
    label { display: block; margin: 12px 0 5px; font-weight: 600; }
    input, textarea, select {
      width: 100%; display: block; padding: 12px; margin: 7px 0;
      background: #0d1117; border: 1px solid var(--border);
      border-radius: 8px; color: white; font: inherit; min-width: 0;
    }
    textarea { min-height: 100px; resize: vertical; }
    button, .download {
      display: inline-block; background: var(--green); color: white;
      border: 0; padding: 12px 18px; border-radius: 8px; font: inherit;
      font-weight: 700; cursor: pointer; text-align: center; text-decoration: none;
    }
    button { width: 100%; margin-top: 12px; }
    button:hover, .download:hover { filter: brightness(1.15); }
    button:disabled { opacity: .6; cursor: wait; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .status {
      padding: 10px; border-radius: 8px; margin-top: 12px;
      background: #0d1117; border: 1px solid var(--border);
      white-space: pre-wrap; word-break: break-word;
    }
    .status.error { color: #ff7b72; border-color: #6e3030; }
    .status.ok { color: #7ee787; }
    .output-box { margin-top: 14px; text-align: center; }
    .output-box img {
      display: block; max-width: 100%; height: auto;
      margin: 12px auto; border-radius: 10px; border: 1px solid var(--border);
    }
    .idea {
      background: #0d1117; border: 1px solid var(--border);
      border-radius: 8px; padding: 14px; margin-top: 12px;
      text-align: right; white-space: pre-wrap;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<header>
  <h1>🛠️ ورشة المطور (Dev Workshop)</h1>
  <p>استوديو أدوات الذكاء الاصطناعي والمحتوى الرقمي</p>
</header>

<main class="container">

  <section class="card">
    <h2>🎨 صانع الصور الفوري</h2>
    <p>اكتب وصف الصورة مباشرة ولن تحتاج لأي مفتاح معقد.</p>
    <label for="imagePrompt">وصف الصورة</label>
    <textarea id="imagePrompt" placeholder="مثال: طفل يلعب في الغابة باحترافية..."></textarea>

    <div class="row">
      <div>
        <label for="imageModel">النموذج</label>
        <select id="imageModel">
          <option value="flux">FLUX (سريع وعالي الجودة)</option>
          <option value="flux-realism">FLUX Realism (واقعي)</option>
          <option value="turbo">Turbo</option>
        </select>
      </div>
      <div>
        <label for="imageSize">الأبعاد</label>
        <select id="imageSize">
          <option value="1024x1024">مربع 1:1</option>
          <option value="1024x1536">عمودي 2:3</option>
          <option value="1536x1024">أفقي 3:2</option>
        </select>
      </div>
    </div>

    <button id="generateImageBtn" type="button">توليد الصورة فوراً</button>
    <div id="imageStatus" class="status">جاهز لاستقبال الوصف.</div>
    <div class="output-box" id="imageOutput"></div>
  </section>

  <section class="card">
    <h2>📝 مولّد أفكار وسكريبتات الفيديو</h2>
    <label for="videoTopic">موضوع الفيديو</label>
    <input id="videoTopic" type="text" placeholder="مثال: مغامرة ليلى في الغابة">

    <button id="generateIdeaBtn" type="button">إنشاء الهيكلة والسيناريو الذكي</button>
    <div id="ideaStatus" class="status">أدخل موضوع الفيديو للبدء.</div>
    <div id="ideaOutput" class="idea hidden"></div>
  </section>

</main>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);

  function setStatus(id, msg, type = "") {
    const el = $(id);
    if (el) { el.textContent = msg; el.className = "status " + type; }
  }

  // توليد الصور المباشر والمضمون 100%
  $("generateImageBtn").addEventListener("click", () => {
    const prompt = $("imagePrompt").value.trim();
    const output = $("imageOutput");
    const btn = $("generateImageBtn");

    if (!prompt) return setStatus("imageStatus", "اكتب وصف الصورة أولاً.", "error");

    btn.disabled = true;
    btn.textContent = "جاري التوليد...";
    output.replaceChildren();
    setStatus("imageStatus", "⏳ يتم إنشاء الصورة الآن، قد يستغرق ذلك ثوانٍ معدودة...");

    const model = $("imageModel").value;
    const [w, h] = $("imageSize").value.split("x");
    const seed = Math.floor(Math.random() * 1000000);

    const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?model=${model}&width=${w}&height=${h}&seed=${seed}&nologo=true`;

    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = imgUrl;

    img.onload = () => {
      output.replaceChildren(img);
      const link = document.createElement("a");
      link.className = "download";
      link.href = imgUrl;
      link.target = "_blank";
      link.textContent = "فتح الصورة بالحجم الكامل";
      output.appendChild(link);
      setStatus("imageStatus", "✅ تم توليد الصورة بنجاح تام!", "ok");
      btn.disabled = false;
      btn.textContent = "توليد صورة أخرى";
    };

    img.onerror = () => {
      setStatus("imageStatus", "❌ تعذر تحميل الصورة، جرّب وصفاً مختصراً بالإنجليزية.", "error");
      btn.disabled = false;
      btn.textContent = "إعادة المحاولة";
    };
  });

  // توليد سكريبت مبسط بدون مفاتيح معقدة
  $("generateIdeaBtn").addEventListener("click", () => {
    const topic = $("videoTopic").value.trim();
    const output = $("ideaOutput");
    const btn = $("generateIdeaBtn");

    if (!topic) return setStatus("ideaStatus", "أدخل موضوع الفيديو أولاً.", "error");

    btn.disabled = true;
    btn.textContent = "جاري إنشاء الهيكلة...";
    output.classList.add("hidden");
    setStatus("ideaStatus", "⏳ يتم صياغة السيناريو الاحترافي...");

    setTimeout(() => {
      const scriptText = `🎬 **عنوان الفيديو المقترح:** السر وراء ${topic}!\n\n` +
        `⏱️ **التقسيم الزمني (60 ثانية):**\n` +
        `• الثواني (0-5): خطاف (Hook) قوي يجذب المشاهد فوراً.\n` +
        `• الثواني (5-45): صلب الموضوع وشرح تفاصيل ${topic} بأسلوب شيق.\n` +
        `• الثواني (45-60): خاتمة سريعة ودعوة للتفاعل (تابعني للمزيد).\n\n` +
        `💡 **نصيحة بصرية:** استخدم لقطات سريعة ومونتاج حيوي لزيادة تفاعل الجمهور.`;

      output.textContent = scriptText;
      output.classList.remove("hidden");
      setStatus("ideaStatus", "✅ تم إنشاء الهيكلة والسيناريو بنجاح!", "ok");
      btn.disabled = false;
      btn.textContent = "إنشاء الهيكلة والسيناريو الذكي";
    }, 1000);
  });

})();
</script>

</body>
</html>
