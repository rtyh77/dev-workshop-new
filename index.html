<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1117">
  <title>ورشة المطور - Dev Workshop Studio</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --accent: #58a6ff;
      --text: #c9d1d9;
      --muted: #8b949e;
      --border: #30363d;
      --green: #238636;
      --shadow: rgba(0,0,0,.3);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px;
      background: var(--bg); color: var(--text);
      font-family: system-ui, "Segoe UI", Tahoma, sans-serif;
      line-height: 1.7;
    }
    header {
      max-width: 900px; margin: 0 auto 24px; padding: 24px 0;
      text-align: center; border-bottom: 1px solid var(--border);
    }
    header h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2.2rem); color: var(--accent); }
    header p { margin: 10px 0 0; color: var(--muted); }
    .container { max-width: 900px; margin: auto; display: grid; gap: 18px; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: clamp(16px, 4vw, 22px);
      box-shadow: 0 4px 12px var(--shadow);
    }
    h2 { margin: 0 0 10px; color: var(--accent); font-size: 1.35rem; }
    label { display: block; margin: 12px 0 5px; font-weight: 600; }
    input, textarea, select {
      width: 100%; display: block; padding: 12px; margin: 7px 0;
      background: #0d1117; border: 1px solid var(--border);
      border-radius: 8px; color: white; font: inherit; min-width: 0;
    }
    textarea { min-height: 100px; resize: vertical; }
    button, .download {
      display: inline-block; background: var(--green); color: white;
      border: 0; padding: 12px 18px; border-radius: 8px; font: inherit;
      font-weight: 700; cursor: pointer; text-align: center; text-decoration: none;
    }
    button { width: 100%; margin-top: 12px; }
    button:hover, .download:hover { filter: brightness(1.15); }
    button:disabled { opacity: .6; cursor: wait; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .note { font-size: .86rem; color: var(--muted); margin: 5px 0; }
    .status {
      padding: 10px; border-radius: 8px; margin-top: 12px;
      background: #0d1117; border: 1px solid var(--border);
      white-space: pre-wrap; word-break: break-word;
    }
    .status.error { color: #ff7b72; border-color: #6e3030; }
    .status.ok { color: #7ee787; }
    .output-box { margin-top: 14px; text-align: center; }
    .output-box img {
      display: block; max-width: 100%; height: auto;
      margin: 12px auto; border-radius: 10px; border: 1px solid var(--border);
    }
    .hidden { display: none !important; }
    .idea {
      background: #0d1117; border: 1px solid var(--border);
      border-radius: 8px; padding: 14px; margin-top: 12px;
      text-align: right; white-space: pre-wrap;
    }
    .keyline { display: flex; gap: 8px; align-items: center; }
    .keyline input { flex: 1; }
    .smallbtn { width: auto; margin: 7px 0; padding: 9px 12px; background: #30363d; }
    .inline-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .inline-actions button, .inline-actions .download { flex: 1 1 180px; }
    @media (max-width: 560px) {
      .row { grid-template-columns: 1fr; }
      .keyline { display: block; }
      .smallbtn { width: 100%; }
      .inline-actions { display: block; }
      .inline-actions button, .inline-actions .download { width: 100%; margin-top: 8px; }
    }
  </style>
</head>
<body>

<header>
  <h1>🛠️ ورشة المطور (Dev Workshop)</h1>
  <p>استوديو أدوات الذكاء الاصطناعي والمحتوى الرقمي</p>
</header>

<main class="container">

  <section class="card">
    <h2>🔑 إعداد الاتصال</h2>
    <p>أدخل مفتاح Pollinations API الصالح لضمان تفعيل النماذج المتقدمة.</p>
    <label for="apiKey">مفتاح API</label>
    <div class="keyline">
      <input id="apiKey" type="password" autocomplete="off" placeholder="أدخل مفتاحك هنا (sk_...)">
      <button class="smallbtn" id="toggleKey" type="button">إظهار</button>
    </div>
    <div class="inline-actions">
      <button id="testApiBtn" type="button">اختبار الاتصال</button>
      <a href="https://enter.pollinations.ai/keys" target="_blank" rel="noopener noreferrer" class="download">إنشاء مفتاح جديد</a>
    </div>
    <div id="keyStatus" class="status">لم يتم إدخال مفتاح بعد.</div>
  </section>

  <section class="card">
    <h2>🎨 مولّد الصور</h2>
    <label for="imagePrompt">وصف الصورة</label>
    <textarea id="imagePrompt" placeholder="مثال: طفل يلعب في الغابة..."></textarea>

    <div class="row">
      <div>
        <label for="imageModel">نموذج الصور</label>
        <select id="imageModel">
          <option value="flux">FLUX (مجاني ومستقر)</option>
          <option value="flux-realism">FLUX Realism (واقعي)</option>
          <option value="turbo">Turbo (سريع جداً)</option>
        </select>
      </div>
      <div>
        <label for="imageSize">أبعاد الصورة</label>
        <select id="imageSize">
          <option value="1024x1024">مربع 1:1</option>
          <option value="1024x1536">عمودي 2:3</option>
          <option value="1536x1024">أفقي 3:2</option>
        </select>
      </div>
    </div>

    <button id="generateImageBtn" type="button">توليد الصورة</button>
    <div id="imageStatus" class="status">جاهز لاستقبال الوصف.</div>
    <div class="output-box" id="imageOutput"></div>
  </section>

  <section class="card">
    <h2>📝 مولّد فكرة الفيديو</h2>
    <label for="videoTopic">موضوع الفيديو</label>
    <input id="videoTopic" type="text" placeholder="مثال: مغامرة ليلى في الغابة">

    <div class="row">
      <div>
        <label for="videoPlatform">المنصة</label>
        <select id="videoPlatform">
          <option>TikTok</option>
          <option>YouTube Shorts</option>
        </select>
      </div>
      <div>
        <label for="videoDuration">المدة</label>
        <select id="videoDuration">
          <option value="60 ثانية">60 ثانية</option>
        </select>
      </div>
    </div>

    <button id="generateIdeaBtn" type="button">إنشاء فكرة وسيناريو ذكي</button>
    <div id="ideaStatus" class="status">أدخل موضوع الفيديو للبدء.</div>
    <div id="ideaOutput" class="idea hidden"></div>
  </section>

</main>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(String(id).replace(/^#/, ""));
  const KEY_STORE = "devWorkshopSessionKey";

  function setStatus(id, msg, type = "") {
    const el = $(id);
    if (el) { el.textContent = msg; el.className = "status " + type; }
  }

  const savedKey = sessionStorage.getItem(KEY_STORE);
  if (savedKey) $("apiKey").value = savedKey;

  $("apiKey").addEventListener("input", () => {
    const val = $("apiKey").value.trim();
    if (val) sessionStorage.setItem(KEY_STORE, val);
    else sessionStorage.removeItem(KEY_STORE);
    setStatus("keyStatus", val ? "تم حفظ المفتاح لهذه الجلسة." : "لم يتم إدخال مفتاح بعد.");
  });

  $("toggleKey").addEventListener("click", () => {
    const f = $("apiKey");
    f.type = f.type === "password" ? "text" : "password";
    $("toggleKey").textContent = f.type === "password" ? "إظهار" : "إخفاء";
  });

  // اختبار الاتصال
  $("testApiBtn").addEventListener("click", async () => {
    const key = $("apiKey").value.trim();
    if (!key) return setStatus("keyStatus", "أدخل المفتاح أولاً.", "error");
    setStatus("keyStatus", "⏳ جاري فحص المفتاح...");
    try {
      const res = await fetch("https://gen.pollinations.ai/v1/models", {
        headers: { "Authorization": "Bearer " + key }
      });
      if (res.ok) setStatus("keyStatus", "✅ المفتاح صالح والاتصال يعمل بنجاح!", "ok");
      else setStatus("keyStatus", "❌ المفتاح غير صالح أو منتهي الصلاحية.", "error");
    } catch (e) {
      setStatus("keyStatus", "❌ تعذر الاتصال بالسيرفر.", "error");
    }
  });

  // توليد الصور (مباشر ومضمون)
  $("generateImageBtn").addEventListener("click", () => {
    const prompt = $("imagePrompt").value.trim();
    const output = $("imageOutput");
    const btn = $("generateImageBtn");

    if (!prompt) return setStatus("imageStatus", "اكتب وصف الصورة أولاً.", "error");

    btn.disabled = true;
    btn.textContent = "جاري التوليد...";
    output.replaceChildren();
    setStatus("imageStatus", "⏳ جاري توليد الصورة عبر السيرفر المباشر...");

    const model = $("imageModel").value;
    const [w, h] = $("imageSize").value.split("x");
    const seed = Math.floor(Math.random() * 1000000);
    const key = $("apiKey").value.trim();

    let imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?model=${model}&width=${w}&height=${h}&seed=${seed}&nologo=true`;
    if (key) imgUrl += `&key=${key}`;

    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = imgUrl;

    img.onload = () => {
      output.replaceChildren(img);
      const link = document.createElement("a");
      link.className = "download";
      link.href = imgUrl;
      link.target = "_blank";
      link.textContent = "فتح الصورة بالحجم الكامل";
      output.appendChild(link);
      setStatus("imageStatus", "✅ تم توليد الصورة بنجاح!", "ok");
      btn.disabled = false;
      btn.textContent = "توليد صورة أخرى";
    };

    img.onerror = () => {
      setStatus("imageStatus", "❌ تعذر تحميل الصورة. جرب وصفاً آخر أو نموذجاً مختلفاً.", "error");
      btn.disabled = false;
      btn.textContent = "إعادة المحاولة";
    };
  });

  // توليد سيناريو الفيديو
  $("generateIdeaBtn").addEventListener("click", async () => {
    const topic = $("videoTopic").value.trim();
    const key = $("apiKey").value.trim();
    const btn = $("generateIdeaBtn");
    const output = $("ideaOutput");

    if (!topic) return setStatus("ideaStatus", "أدخل موضوع الفيديو أولاً.", "error");
    if (!key) return setStatus("ideaStatus", "❌ يلزم إدخال مفتاح API صالح لتوليد النصوص.", "error");

    btn.disabled = true;
    btn.textContent = "جاري الكتابة...";
    output.classList.add("hidden");
    setStatus("ideaStatus", "⏳ جاري توليد السكريبت...");

    try {
      const res = await fetch("https://text.pollinations.ai/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          messages: [
            { role: "system", content: "أنت كاتب محتوى عربي محترف." },
            { role: "user", content: `اكتب فكرة وسيناريو قصير عن: ${topic}` }
          ],
          model: "openai",
          code: key
        })
      });

      const text = await res.text();
      if (res.ok && text) {
        output.textContent = text;
        output.classList.remove("hidden");
        setStatus("ideaStatus", "✅ تم إنشاء السيناريو بنجاح!", "ok");
      } else {
        throw new Error(text || "خطأ في المفتاح");
      }
    } catch (e) {
      setStatus("ideaStatus", "❌ فشل الطلب. تأكد من حصولك على مفتاح جديد من الرابط أعلاه.", "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "إنشاء فكرة وسيناريو ذكي";
    }
  });

})();
</script>

</body>
</html>
